# Services that run next to Specter on the device. Each one listens on localhost only.

name: specter

services:
  nats:
    image: nats:2.14.6-alpine
    command: ["--config", "/etc/nats/nats-server.conf"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  go2rtc:
    image: alexxit/go2rtc:1.9.14
    ports:
      - "127.0.0.1:1984:1984"
      - "127.0.0.1:8554:8554"
      # WebRTC media for viewers on the network; it carries only streams the API negotiated.
      - "8555:8555/tcp"
      - "8555:8555/udp"
    volumes:
      # Read-only, so go2rtc can never write camera URLs, which contain passwords, to disk.
      # Specter registers cameras in memory through the go2rtc API instead.
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    environment:
      # The addresses viewers reach port 8555 at, such as 192.168.1.50:8555; stun:8555 lets
      # go2rtc discover its public address instead.
      GO2RTC_WEBRTC_CANDIDATES: ${GO2RTC_WEBRTC_CANDIDATES:-stun:8555}
    restart: unless-stopped

volumes:
  nats-data:
  qdrant-data:
