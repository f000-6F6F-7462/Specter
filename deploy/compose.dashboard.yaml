# The dashboard, added to Specter's services to make the whole product. Use the three files
# together with the root .env (`make up` does):
#   docker compose --env-file .env -f deploy/compose.infra.yaml -f deploy/compose.specter.yaml \
#     -f deploy/compose.dashboard.yaml up -d --build
#
# The dashboard is the only part published beyond the device: users open it on DASHBOARD_PORT. It
# reaches Specter's API, NATS and Qdrant by name on the Compose network.

services:
  dashboard:
    image: specter-dashboard:local
    build:
      context: ../dashboard
      dockerfile: ../deploy/dashboard.Dockerfile
    # Every setting of the root .env; the values below are the ones that differ inside Docker.
    # Optional, so `down`, `ps` and `logs` work without it; `make up` checks it first.
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 12113
      SPECTER_API_URL: http://api:8000
      SPECTER_NATS_URL: nats://nats:4222
      SPECTER_API_TOKEN_FILE: /run/secrets/specter_api_token
      QDRANT_URL: http://qdrant:6333
    secrets: [specter_api_token]
    ports:
      - "${DASHBOARD_PORT:-8080}:12113"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:12113/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      api: {condition: service_healthy}
      nats: {condition: service_healthy}
      qdrant: {condition: service_started}
    restart: unless-stopped
