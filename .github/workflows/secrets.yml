# Keeps secrets out of the repository on every branch. GitHub's push protection refuses known
# secret formats before they land; this job catches the rest after a push and fails the check that
# the main branch requires before a merge. A secret it reports has already reached GitHub: rotate
# it first, then remove it from history.
name: secrets

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: a secret committed and then deleted is still in it.
          fetch-depth: 0

      # The same two checks as .pre-commit-config.yaml, for commits made without the hooks.
      - name: .env.example holds no values, and no .env or secret file is committed
        run: |
          pipx run pre-commit run env-example-has-no-values --all-files
          pipx run pre-commit run no-secret-files --all-files

      # Known formats (API keys, tokens, private keys) and high-entropy strings, in every commit.
      - name: gitleaks
        run: |
          curl --silent --show-error --fail --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar --extract --gzip gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1
