# Local backing services for Specter. The default test gate needs none of these
# (it uses in-process adapters); bring them up for `pytest -m integration` and for
# running the API / workers against real infra. Run from the repo root (paths below
# and the Dockerfile build context assume that), or use `make up` / `make up-app`.
#
#   docker compose -f docker/docker-compose.yml up -d
#   SPECTER_BUS=redis SPECTER_BLOB=minio SPECTER_VECTORS=qdrant make migrate run-api
#
#   docker compose -f docker/docker-compose.yml --profile app up -d   # + api/ingest/enroll, CPU-only

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: specter
      POSTGRES_PASSWORD: specter
      POSTGRES_DB: specter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specter"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  minio:
    # minio/minio was removed from Docker Hub (MinIO stopped publishing container images
    # there in Oct 2025); quay.io is MinIO's own registry and still serves it. Pinned to
    # RELEASE.2025-09-07T16-13-09Z, the newest plain release tag actually published there.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: specter
      MINIO_ROOT_PASSWORD: specter123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles: ["app"]
    environment:
      SPECTER_DATABASE__URL: postgresql+asyncpg://specter:specter@postgres:5432/specter
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"

  api: &app
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles: ["app"]
    ports:
      - "8000:8000"
    environment: &app-env
      SPECTER_BUS: redis
      SPECTER_BLOB: minio
      SPECTER_VECTORS: qdrant
      SPECTER_INFERENCE: insightface
      SPECTER_MEDIA: gstreamer
      SPECTER_MODELS__DETECTOR__IMPL: yolo
      SPECTER_MODELS__EMBEDDERS__FACE__IMPL: insightface
      SPECTER_REDIS__URL: redis://redis:6379/0
      SPECTER_DATABASE__URL: postgresql+asyncpg://specter:specter@postgres:5432/specter
      SPECTER_QDRANT__URL: http://qdrant:6333
      SPECTER_S3__ENDPOINT_URL: http://minio:9000
      SPECTER_S3__ACCESS_KEY: specter
      SPECTER_S3__SECRET_KEY: specter123
      SPECTER_S3__BUCKET: specter
      SPECTER_SECURITY__API_KEY: dev-only-change-me
      SPECTER_SECURITY__SECRET_KEY: dev-only-fernet-key-change-me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["api"]

  ingest:
    <<: *app
    ports: []
    command: ["ingest"]

  enroll:
    <<: *app
    ports: []
    command: ["enroll"]

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  miniodata:
