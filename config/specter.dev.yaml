# Wiring for running Specter's processes from source, from the repository root, against the
# services in deploy/compose.infra.yaml: where the data, models and secrets live on this machine
# and where the services listen. It holds no settings; those come from the root .env, loaded with
# `uv run --env-file .env specter --config config/specter.dev.yaml <process>` (see
# docs/running.md). In Docker, deploy/compose.specter.yaml wires the same values.

paths:
  # Relative to the repository root, and ignored by git.
  data_directory: .dev/data
  # Filled by `make models`.
  models_directory: models

services:
  nats_url: nats://127.0.0.1:4222
  qdrant_url: http://127.0.0.1:6333
  go2rtc_url: http://127.0.0.1:1984
  go2rtc_rtsp_url: rtsp://127.0.0.1:8554

security:
  credentials_key_file: .dev/secrets/credentials.key
  # Send it as a bearer token: curl -H "Authorization: Bearer $(cat .dev/secrets/api.token)"
  api_token_file: .dev/secrets/api.token
